<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anotou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F3F2EE; --card:#FFFFFF; --ink:#0C0C0C; --ink-2:#5E5E5A; --ink-3:#9A9A94;
  --line:#E6E5DF; --soft:#F7F6F2; --accent:#17A34A; --accent-ink:#0B6B30; --lime:#C9F36B;
  --r-xl:16px; --r-lg:12px; --r-md:12px; --r-sm:10px;
  --shadow:0 1px 0 rgba(0,0,0,.03), 0 8px 24px -12px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Geist',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em;padding-bottom:110px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:16px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 18px}
.brand{font-weight:600;font-size:20px;letter-spacing:-.04em;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:50%;background:var(--ink);display:inline-grid;place-items:center}
.brand i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--lime)}
.me-chip{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:4px 12px 4px 4px;font-size:14px;font-weight:500;box-shadow:var(--shadow);color:inherit;text-decoration:none}
.me-chip:empty{display:none}
.av{width:32px;height:32px;border-radius:50%;background:#DDE9DF;color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.off{background:var(--soft);color:var(--ink-3)}

/* grid */
.grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}
.grid.solo{max-width:420px;margin:0 auto}
@media(min-width:900px){
  .grid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
  .grid.solo{grid-template-columns:minmax(0,1fr)}
  .grid.solo.wide{max-width:640px}
  .span2{grid-column:1/-1}
}

/* cards */
.card{background:var(--card);border-radius:var(--r-xl);padding:22px;box-shadow:var(--shadow)}
.eyebrow{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.h2{font-size:22px;font-weight:500;letter-spacing:-.03em;margin-top:4px}
.title-xl{font-size:30px;font-weight:500;letter-spacing:-.04em;line-height:1.1;margin-top:8px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}

/* hero */
.hero{background:var(--ink);color:#fff;border-radius:var(--r-xl);padding:24px 22px 20px;position:relative;overflow:hidden;min-height:340px;display:flex;flex-direction:column}
.hero::before{content:"";position:absolute;inset:auto -30% -55% auto;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(23,163,74,.55),rgba(23,163,74,0) 65%);pointer-events:none}
.hero .eyebrow{color:#A9A9A3}
.hero .check{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#D6D6D0;position:relative}
.hero .check a{color:#D6D6D0;text-decoration:none}
.hero h1{font-size:40px;line-height:1.02;font-weight:500;letter-spacing:-.045em;margin:14px 0 6px;position:relative}
.hero h1.sm{font-size:32px;margin-top:12px}
.hero .sub{color:#B5B5AF;font-size:14px;position:relative}
.pote-row{display:flex;align-items:flex-end;gap:14px;margin:auto 0 22px;position:relative}
.pote-num{font-size:96px;line-height:.82;font-weight:400;letter-spacing:-.06em}
.pote-label{font-size:13px;color:#A9A9A3;margin:28px 0 10px;position:relative}
.pote-meta{padding-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;font-size:12.5px;font-weight:500;padding:5px 10px;white-space:nowrap}
.pill.lime{background:var(--lime);color:#14200A}
.pill.ghost{background:rgba(255,255,255,.1);color:#E9E9E4}
.pill.soft{background:var(--soft);border:1px solid var(--line)}
.pill.off{background:var(--soft);border:1px solid var(--line);color:var(--ink-3)}
.pote-meta p{font-size:13px;color:#A9A9A3;margin-top:8px}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(255,255,255,.12);padding-top:14px;position:relative}
.hero-stats div{padding-right:10px;min-width:0}
.hero-stats div+div{border-left:1px solid rgba(255,255,255,.12);padding-left:14px}
.hero-stats b{display:block;font-size:26px;font-weight:500;letter-spacing:-.03em;white-space:nowrap}
.hero-stats span{font-size:12.5px;color:#9C9C96}

/* patrocinador */
.sponsor{display:flex;gap:14px;align-items:center;padding:16px}
.sponsor .logo{width:64px;height:64px;border-radius:12px;background:#F2F1ED;border:1px dashed #E2E0D9;display:grid;place-items:center;font-size:11px;color:var(--ink-3);flex:none;overflow:hidden}
.sponsor .logo img{width:100%;height:100%;object-fit:cover}
.sponsor .who b{font-size:18px;letter-spacing:-.02em;margin:2px 0}
.sponsor .who span{font-size:13px;color:var(--ink-2)}
.sponsor .who small{font-size:12px;color:var(--ink-2)}

/* chuteira */
.boot-top{display:flex;align-items:center;gap:14px}
.boot-ico{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font-size:30px;flex:none}
.boot-name{font-size:30px;font-weight:500;letter-spacing:-.04em;line-height:1}
.boot-goals{font-size:13px;color:var(--ink-2);margin-top:6px}
.prog{margin:22px 0 8px;height:10px;border-radius:999px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;border-radius:999px;background:var(--ink)}
.prog-legend{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2)}
.prog-legend b{color:var(--ink);font-weight:600}
.tiers{display:flex;gap:6px;margin-top:18px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tiers::-webkit-scrollbar{display:none}
.tier{flex:none;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;font-size:12.5px;color:var(--ink-2);background:var(--soft);min-width:92px}
.tier strong{display:block;color:var(--ink);font-weight:500;font-size:13.5px}
.tier.on{background:var(--ink);border-color:var(--ink);color:#BDBDB7}
.tier.on strong{color:#fff}
.tier.done{opacity:.55}
@media(min-width:900px){.tiers{flex-wrap:wrap;overflow:visible}.tier{min-width:0;flex:1 1 30%}}

/* chart */
.chart-wrap{position:relative;margin:4px -6px 0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tag{position:absolute;transform:translate(calc(-100% + 14px),-150%);background:var(--ink);color:#fff;font-size:12px;font-weight:500;padding:5px 9px;border-radius:999px;white-space:nowrap}
.chart-foot{display:flex;gap:18px;margin-top:14px;font-size:13px;color:var(--ink-2)}
.chart-foot b{display:block;font-size:20px;color:var(--ink);font-weight:500;letter-spacing:-.03em}

/* segmented */
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{padding:7px 12px;border-radius:999px;font-size:13px;color:var(--ink-2);font-weight:500;transition:.2s;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff}
.seg.full{display:flex}
.seg.full button{flex:1}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:6px}
.tabs button{padding:0 0 10px;font-size:15px;color:var(--ink-3);font-weight:500;position:relative}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}

/* listas */
.rank,.list{list-style:none}
.rank li,.list li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.rank li:last-child,.list li:last-child{border-bottom:0}
.list li.edit{display:block;border-bottom:1px solid var(--line);padding:0 0 12px}
.rank .pos{width:22px;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rank li.top .pos{color:var(--ink);font-weight:600}
.who{flex:1;min-width:0}
.who b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12px;color:var(--ink-3)}
.li-off .who b,.li-off .who span{color:var(--ink-3)}
.rank .val{font-size:22px;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.rank li.me{background:var(--soft);margin:0 -10px;padding:11px 10px;border-radius:var(--r-sm);border-bottom-color:transparent}
.bar-mini{height:4px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.bar-mini i{display:block;height:100%;background:var(--accent)}
.empty{padding:28px 0;text-align:center;color:var(--ink-3);font-size:14px;line-height:1.5}
.list li.click{cursor:pointer}
.meta{text-align:right;flex:none}
.meta small{display:block;font-size:12px;color:var(--ink-3);margin-top:6px}
.mono{letter-spacing:.06em;font-variant-numeric:tabular-nums}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-2);margin-top:12px;padding-top:14px;border-top:1px solid var(--line)}
.foot button{color:var(--ink);font-weight:500;font-size:13px}

/* formulários */
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:13.5px;font-weight:500;color:var(--ink);margin-bottom:8px}
.input{width:100%;font:inherit;font-size:15px;padding:13px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--soft);color:var(--ink);outline:none;min-width:0}
.input::placeholder{color:var(--ink-3);text-transform:none;letter-spacing:normal}
.input:focus{border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.code-box{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 14px}
.code-box b{font-weight:600;font-size:15px}
.hint{font-size:12px;color:var(--ink-3);margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:999px;font-weight:500;font-size:14px;background:var(--ink);color:#fff;white-space:nowrap;text-decoration:none}
.btn.block{width:100%;margin-top:18px;padding:15px 18px;font-size:15px}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.white{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.input{flex:1 1 140px;width:auto}
.msg{font-size:13px;margin-top:12px;color:var(--ink-2)}
.msg:empty{display:none}
.msg.err{color:#B42318}
.note{font-size:13px;color:var(--ink-2);margin-top:6px;line-height:1.45}
.center{text-align:center;margin-top:16px}
.lnk{font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:2px;color:var(--ink);cursor:pointer;flex:none}
.sub-title{font-size:13.5px;font-weight:500;margin:20px 0 4px}
.search{position:relative;margin-top:2px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-3)}
.search .input{padding-left:42px}
.box{background:var(--soft);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;margin-top:12px}
.box .input{background:#fff}

/* opções de método */
.opt{border:1px solid var(--line);background:var(--soft);border-radius:var(--r-md);margin-top:8px}
.opt.on{background:var(--card);border:1.5px solid var(--ink)}
.opt-head{display:flex;gap:12px;align-items:flex-start;padding:14px;cursor:pointer}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid #C9C8C1;flex:none;margin-top:1px;display:grid;place-items:center;background:#fff}
.opt.on .radio{border-color:var(--ink);background:var(--ink)}
.opt.on .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--lime)}
.opt-head b{display:block;font-weight:500;font-size:15px}
.opt-head span{font-size:12.5px;color:var(--ink-2);display:block;margin-top:3px;line-height:1.35}
.opt-extra{padding:0 14px 14px 46px}
.range-legend{display:flex;justify-content:space-between;font-size:12.5px}
.range-legend span{color:var(--ink-2)}
.range{width:100%;accent-color:var(--ink);margin-top:6px}
.stepper{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px;flex:none}
.stepper button{width:32px;height:32px;border-radius:50%;background:#fff;font-size:16px;box-shadow:var(--shadow)}
.stepper b{min-width:26px;text-align:center;font-weight:500;font-size:16px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px}
.setting b{display:block;font-weight:500;font-size:13.5px}
.setting span{font-size:12px;color:var(--ink-3)}
.switch{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--ink)}
.switch.on::after{left:21px;background:var(--lime)}
.check-row{display:flex;align-items:center;gap:12px;flex:1;cursor:pointer;min-width:0}
.check-row input{width:18px;height:18px;accent-color:var(--ink);flex:none}
.notas{display:flex;gap:4px;flex:none}
.notas button{width:30px;height:30px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--soft);font-size:13px;font-weight:500}
.notas button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.toast:empty{display:none}

/* bottom nav */
.nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;
  display:flex;gap:4px;padding:6px;border-radius:999px;background:rgba(18,18,18,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.nav:empty{display:none}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 14px;border-radius:999px;color:#A3A39D;font-size:11px;text-decoration:none;font-weight:500;min-width:64px}
.nav a.on{background:#fff;color:var(--ink)}
.nav svg{width:20px;height:20px}

.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}}
@media(max-width:380px){.hero h1{font-size:34px}.hero h1.sm{font-size:28px}.pote-num{font-size:80px}.nav a{min-width:56px;padding:8px 10px}.notas button{width:27px}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><i></i>Anotou</div>
    <a class="me-chip" id="meChip" href="#pelada"></a>
  </header>

  <main class="grid" id="view">
    <section class="card"><div class="empty">Carregando…</div></section>
  </main>
</div>

<div class="toast" id="toast" role="status"></div>
<nav class="nav" id="nav" aria-label="Navegação"></nav>

<script>
/* =========================================================
   SUPABASE — onde os dados ficam guardados.
   A chave publicável pode ficar no site: quem protege os
   dados são as regras de acesso (RLS) do banco.
   ========================================================= */
const SUPABASE_URL = "https://rsqyxsjqdkgkcwexbkfi.supabase.co";
const SUPABASE_KEY = "sb_publishable_VsGcdzuHKXG3cVMuBact2g_VnTJEFgB";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ===================== ESTADO =====================
   3 níveis de acesso:
   - dev (administrador da plataforma): vê e altera todas as peladas
   - presidente: altera a própria pelada
   - jogador: vê os próprios números, vota e acompanha os rankings */
const vazio = () => ({ user: null, perfil: null, dev: false, modoDev: false, patrocinio: {},
  peladas: [], todas: [], membrosTodas: [], usuarios: [], global: null,
  pelada: null, membro: null, membros: [], partidas: [], gols: [], presencas: [], lances: [], medias: [], meusVotos: [], emails: new Map() });
const app = vazio();
const state = { periodo: "mes", stat: "gols", login: "codigo", loginEmail: "", loginPelada: "", partida: null,
  busca: "", filtro: "todas", verTodas: false, novaPelada: false, buscaUsu: "",
  buscaJog: "", filtroJog: "todos", verTodosJog: false, editando: null, addJogador: false, editMetrica: null };

/* ===================== REGRAS ===================== */
const CHUTEIRAS = [
  { nome: "Plástico", min: 0,   cor: "#F6DCDC", emoji: "👟", filtro: "grayscale(1) sepia(1) saturate(3) hue-rotate(300deg)" },
  { nome: "Ferro",    min: 10,  cor: "#E7E7E4", emoji: "👟", filtro: "grayscale(1)" },
  { nome: "Bronze",   min: 25,  cor: "#F5E2CF", emoji: "👟", filtro: "sepia(1) saturate(2) hue-rotate(10deg)" },
  { nome: "Prata",    min: 50,  cor: "#E9ECEF", emoji: "👟", filtro: "grayscale(1) brightness(1.6)" },
  { nome: "Ouro",     min: 75,  cor: "#F8EDC4", emoji: "👟", filtro: "sepia(1) saturate(4) hue-rotate(5deg) brightness(1.15)" },
  { nome: "Diamante", min: 125, cor: "#D6F3F7", emoji: "👟", filtro: "sepia(1) saturate(5) hue-rotate(170deg) brightness(1.3)" }
];
const METODOS = [
  { k: "votacao",     nome: "Votação dos jogadores", desc: "Depois de cada pelada, os jogadores votam nos colegas." },
  { k: "organizador", nome: "Nota do organizador",   desc: "O adm define o pote de cada jogador manualmente." },
  { k: "desempenho",  nome: "Por desempenho",        desc: "Calculado por gols, assistências e presença." },
  { k: "misto",       nome: "Misto",                 desc: "Votação + desempenho, com peso ajustável." }
];
const STATUS = { ativa: "Ativa", pausada: "Pausada", inativa: "Inativa" };

const chuteiraDe = g => [...CHUTEIRAS].reverse().find(c => g >= c.min);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const urlSegura = u => /^https?:\/\//i.test(u || "") ? u : "";
const iniciais = n => String(n || "?").split(" ").filter(Boolean).slice(0,2).map(p => p[0]).join("").toUpperCase();
const avatar = (nome, foto, off) => `<span class="av${off?" off":""}">${urlSegura(foto) ? `<img src="${esc(foto)}" alt="">` : esc(iniciais(nome))}</span>`;
const fmt = n => n.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmtPeso = n => Number(n).toLocaleString("pt-BR", { maximumFractionDigits: 2 });
const dataCurta = s => { const [y,m,d] = s.split("-"); return `${d}/${m}`; };
const dataBr = s => { const [y,m,d] = s.slice(0,10).split("-"); return `${d}/${m}/${y}`; };
const dataLonga = s => new Date(s + "T12:00").toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
const iso = t => `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
const hoje = () => iso(new Date());
const diasAtras = n => { const t = new Date(); t.setDate(t.getDate() - n); return iso(t); };
const mesAtual = () => hoje().slice(0, 7);
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : "";
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;

const membroDe = id => app.membros.find(m => m.jogador_id === id);
const nomeDe = id => { const m = membroDe(id); return m ? (m.jogadores.apelido || m.jogadores.nome) : "Ex-membro"; };

/* ===================== POTES =====================
   Cada jogador recebe uma nota de 0 a 1 conforme o método da pelada.
   A nota vira pote (1 = melhor) e aparece no gráfico na escala de 1 a 6. */
function janela(offset = 0){
  const dias = app.pelada.janela_semanas * 7;
  const fim = diasAtras(offset * dias), ini = diasAtras((offset + 1) * dias);
  return new Set(app.partidas.filter(p => p.data > ini && p.data <= fim).map(p => p.id));
}

function valorMetrica(m, jid, ids){
  const jogou = app.presencas.filter(p => p.jogador_id === jid && ids.has(p.partida_id)).length;
  switch (m.chave) {
    case "gols": return app.gols.filter(g => g.autor_id === jid && ids.has(g.partida_id)).length;
    case "assistencias": return app.gols.filter(g => g.assistencia_id === jid && ids.has(g.partida_id)).length;
    case "jogos": return jogou;
    case "presenca": return ids.size ? (jogou / ids.size) * 10 : 0;
    default: return app.lances.filter(l => l.jogador_id === jid && l.metrica === m.chave && ids.has(l.partida_id))
      .reduce((s, l) => s + l.qtd, 0);
  }
}

function avaliar(ids){
  const P = app.pelada, votos = new Map(), desemp = new Map(), notas = new Map();
  for (const m of app.membros) {
    const r = app.medias.filter(x => x.jogador_id === m.jogador_id && ids.has(x.partida_id));
    if (r.length) votos.set(m.jogador_id, r.reduce((s, x) => s + (Number(x.media) - 1) / 5, 0) / r.length);
  }
  const ativas = P.metricas.filter(m => m.ativo);
  const presentes = new Set(app.presencas.filter(p => ids.has(p.partida_id)).map(p => p.jogador_id));
  const pts = new Map([...presentes].map(j => [j, ativas.reduce((s, m) => s + valorMetrica(m, j, ids) * Number(m.peso), 0)]));
  const max = Math.max(0, ...pts.values());
  pts.forEach((v, j) => desemp.set(j, max > 0 ? v / max : 0));
  const w = P.peso_votacao / 100;
  for (const m of app.membros) {
    const j = m.jogador_id, v = votos.get(j), d = desemp.get(j);
    const n = P.metodo === "votacao" ? v
      : P.metodo === "desempenho" ? d
      : P.metodo === "misto" ? (v != null && d != null ? w * v + (1 - w) * d : v ?? d)
      : undefined;
    if (n != null) notas.set(j, n);
  }
  return notas;
}

const poteDaNota = s => { const N = app.pelada.qtd_potes; return Math.min(Math.max(N - Math.floor(s * N), 1), N); };

function potes(offset = 0){
  const out = new Map();
  if (app.pelada.metodo === "organizador") {
    app.membros.forEach(m => m.pote_manual && out.set(m.jogador_id, { pote: Math.min(m.pote_manual, app.pelada.qtd_potes), nota: null }));
    return out;
  }
  avaliar(janela(offset)).forEach((s, j) => out.set(j, { pote: poteDaNota(s), nota: 1 + 5 * s }));
  return out;
}

function minhaSerie(){
  if (app.pelada.metodo === "organizador") return [];
  return app.partidas
    .map(p => ({ semana: p.data, s: avaliar(new Set([p.id])).get(app.user.id) }))
    .filter(x => x.s != null)
    .map(x => ({ semana: x.semana, media: 1 + 5 * x.s }));
}

async function entrar(user){
  app.user = user;
  await run(async () => {
    const [perfil, devs, config] = (await Promise.all([
      sb.from("jogadores").select("*").eq("id", user.id).single(),
      sb.from("devs").select("jogador_id").eq("jogador_id", user.id),
      sb.from("config").select("patrocinio").maybeSingle()
    ])).map(ok);
    app.perfil = perfil;
    app.dev = devs.length > 0;
    app.patrocinio = (config && config.patrocinio) || {};
    const convite = ler("convite");
    gravar("convite", null);
    // o dev não entra em pelada por código: ele vê todas pelo painel, sem virar jogador
    if (convite && !app.dev) {
      const id = ok(await sb.rpc("entrar_na_pelada", { codigo: convite }));
      gravar("pelada", id);
      aviso(convite.replace(/[^A-Z0-9]/g, "").length === 10 ? "Você entrou como presidente!" : "Você entrou na pelada!");
    }
    await carregarPeladas();
    app.modoDev = app.dev;   // dev sempre abre no painel de developer
    if (app.modoDev) {
      await carregarTodas();
      if (!NAV_DEV.some(n => n[0] === location.hash.slice(1))) location.hash = "peladas";
      return route();
    }
    const salva = app.peladas.find(p => p.id === ler("pelada"));
    const escolhida = salva || (app.peladas.length === 1 ? app.peladas[0] : null);
    if (escolhida) await abrirPelada(escolhida.id); else route();
  });
}

async function carregarPeladas(){
  const rows = ok(await sb.from("membros").select("papel, peladas(*)").eq("jogador_id", app.user.id));
  app.peladas = rows.filter(r => r.peladas).map(r => ({ ...r.peladas, papel: r.papel }))
    .sort((a,b) => a.nome.localeCompare(b.nome, "pt-BR"));
}

async function carregarTodas(){
  const [todas, membros] = (await Promise.all([
    sb.from("peladas").select("*").order("criado_em", { ascending: false }),
    tudo(() => sb.from("membros").select("pelada_id, tipo, entrou_em").order("pelada_id").order("jogador_id"))
  ])).map(ok);
  app.todas = todas;
  app.membrosTodas = membros;
}

async function abrirPelada(id){
  app.pelada = app.peladas.find(p => p.id === id) || app.todas.find(p => p.id === id);
  if (!app.modoDev) gravar("pelada", id);
  state.partida = null; state.editando = null; state.editMetrica = null; state.addJogador = false; state.verTodosJog = false;
  await carregar();
  route();
}

// O Supabase devolve no máximo 1000 linhas por consulta: busca em páginas até acabar
async function tudo(consulta){
  const linhas = [];
  for (let de = 0; ; de += 1000) {
    const r = ok(await consulta().range(de, de + 999));
    linhas.push(...r);
    if (r.length < 1000) return { data: linhas, error: null };
  }
}

async function carregar(){
  const p = app.pelada.id;
  const [pelada, codPres, membros, partidas, gols, presencas, lances, medias, meusVotos, pendentes] = (await Promise.all([
    sb.from("peladas").select("*").eq("id", p).single(),
    sb.from("codigos_presidente").select("sufixo").eq("pelada_id", p),   // só dev e presidente recebem
    tudo(() => sb.from("membros").select("jogador_id, papel, tipo, pote_manual, entrou_em, jogadores(nome, apelido, foto_url, pendente)").eq("pelada_id", p)),
    tudo(() => sb.from("partidas").select("id, data").eq("pelada_id", p).order("data")),
    tudo(() => sb.from("gols").select("id, partida_id, autor_id, assistencia_id").eq("pelada_id", p).order("criado_em").order("id")),
    tudo(() => sb.from("presencas").select("partida_id, jogador_id").eq("pelada_id", p).order("partida_id").order("jogador_id")),
    tudo(() => sb.from("lances").select("id, partida_id, jogador_id, metrica, qtd").eq("pelada_id", p).order("id")),
    sb.rpc("medias", { p }),
    tudo(() => sb.from("votos").select("partida_id, votado_id, nota").eq("pelada_id", p).eq("votante_id", app.user.id).order("id")),
    sb.from("perfis_pendentes").select("jogador_id, email")   // só dev e presidente recebem
  ])).map(ok);
  Object.assign(app, { membros, partidas, gols, presencas, lances, medias, meusVotos });
  app.emails = new Map(pendentes.map(x => [x.jogador_id, x.email]));
  app.pelada = { ...pelada, papel: app.pelada.papel, sufixo: codPres.length ? codPres[0].sufixo : null };
  app.membro = membroDe(app.user.id);
  if (!app.membro && !app.modoDev) {   // foi removido da pelada
    app.pelada = null;
    await carregarPeladas();
  }
}

function meusNumeros(){
  const id = app.user.id;
  return {
    tipo: cap(app.membro.tipo),
    gols: app.gols.filter(g => g.autor_id === id).length,
    assistencias: app.gols.filter(g => g.assistencia_id === id).length,
    jogos: app.presencas.filter(p => p.jogador_id === id).length
  };
}

function rankingDe(periodo){
  const mes = mesAtual();
  const ids = new Set((periodo === "semana" ? app.partidas.filter(p => p.data > diasAtras(7))
    : periodo === "mes" ? app.partidas.filter(p => p.data.startsWith(mes))
    : app.partidas).map(p => p.id));
  const gols = app.gols.filter(g => ids.has(g.partida_id));
  return app.membros.map(m => ({
    id: m.jogador_id,
    nome: m.jogadores.apelido || m.jogadores.nome,
    foto: m.jogadores.foto_url,
    tipo: cap(m.tipo),
    gols: gols.filter(g => g.autor_id === m.jogador_id).length,
    assistencias: gols.filter(g => g.assistencia_id === m.jogador_id).length,
    me: m.jogador_id === app.user.id
  }));
}

function rankingGlobal(periodo){
  const G = app.global;
  const mes = mesAtual(), semana = diasAtras(7);
  const ids = new Set(G.partidas.filter(p => periodo === "geral" || (periodo === "mes" ? p.data.startsWith(mes) : p.data > semana)).map(p => p.id));
  const gols = G.gols.filter(g => ids.has(g.partida_id));
  return G.jogadores.map(j => ({
    id: j.id,
    nome: j.apelido || j.nome,
    foto: j.foto_url,
    tipo: plural(new Set(G.membros.filter(m => m.jogador_id === j.id).map(m => m.pelada_id)).size, "pelada", "peladas"),
    gols: gols.filter(g => g.autor_id === j.id).length,
    assistencias: gols.filter(g => g.assistencia_id === j.id).length,
    me: j.id === app.user.id
  }));
}

      <div class="pote-num">${poteAtual ?? "–"}</div>
      <div class="pote-meta">
        ${poteAtual === null ? `<span class="pill ghost">Sem pote ainda</span>`
          : variacao > 0 ? `<span class="pill lime">↑ Subiu ${plural(variacao, "pote", "potes")}</span>`
          : variacao < 0 ? `<span class="pill ghost">↓ Caiu ${plural(-variacao, "pote", "potes")}</span>`
          : `<span class="pill ghost">= Mesmo pote</span>`}
        <p>${organizador ? "Definido pelo organizador"
          : atual ? `Média ${fmt(atual.nota)} · últimas ${J} semanas`
          : "O pote sai depois da primeira avaliação"}</p>
      </div>
    </div>
    <div class="hero-stats">
      <div><b>${me.gols}</b><span>Gols</span></div>
      <div><b>${me.assistencias}</b><span>Assistências</span></div>
      <div><b>${me.jogos}</b><span>Jogos</span></div>
    </div>`;

  // CHUTEIRA
  (function(){
    const atualC = chuteiraDe(me.gols);
    const idx = CHUTEIRAS.indexOf(atualC);
    const prox = CHUTEIRAS[idx + 1];
    const pct = prox ? ((me.gols - atualC.min) / (prox.min - atualC.min)) * 100 : 100;
    document.getElementById("boot").innerHTML = `
      <div class="card-head">
        <div><div class="eyebrow">Sua chuteira</div></div>
        <span class="pill soft">Nível ${idx+1} de ${CHUTEIRAS.length}</span>
      </div>
      <div class="boot-top">
        <div class="boot-ico" style="background:${atualC.cor}"><span style="filter:${atualC.filtro}">${atualC.emoji}</span></div>
        <div>
          <div class="boot-name">${atualC.nome}</div>
          <div class="boot-goals">${me.gols} gols marcados</div>
        </div>
      </div>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div class="prog-legend">
        <span>${atualC.nome} · ${atualC.min}</span>
        ${prox ? `<span>Faltam <b>${prox.min - me.gols} gols</b> para ${prox.nome}</span>` : `<span><b>Nível máximo</b></span>`}
      </div>
      <div class="tiers">
        ${CHUTEIRAS.map((c,i) => {
          const nx = CHUTEIRAS[i+1];
          const faixa = nx ? `${c.min}–${nx.min-1} gols` : `${c.min}+ gols`;
          return `<div class="tier ${i===idx?"on":i<idx?"done":""}"><strong>${c.nome}</strong>${faixa}</div>`;
        }).join("")}
      </div>`;
  })();

  // EVOLUÇÃO DO POTE (gráfico)
  (function(){
    const todas = minhaSerie();
    const pts = todas.slice(-8);
    const N = app.pelada.qtd_potes;
    const head = `<div class="card-head">
        <div><div class="eyebrow">Evolução do pote</div><div class="h2">${poteAtual === null ? "Ainda sem pote" : `Pote ${poteAtual} nas últimas ${J} semanas`}</div></div>
      </div>`;
    if (!pts.length) {
      document.getElementById("trend").innerHTML = `${head}<div class="empty">${organizador
        ? "Nessa pelada o pote é definido pelo organizador."
        : "Depois de cada pelada sua nota aparece aqui."}</div>`;
      return;
    }
    const W = window.innerWidth < 600 ? 360 : 520, H = window.innerWidth < 600 ? 200 : 220, padL = 34, padR = 16, padT = 26, padB = 30;
    const x = i => pts.length > 1 ? padL + (i * (W - padL - padR)) / (pts.length - 1) : (padL + W - padR) / 2;
    const y = m => padT + ((6 - m) / 5) * (H - padT - padB);   // 6 em cima (pote 1)
    const path = pts.map((p,i) => `${i?"L":"M"}${x(i).toFixed(1)},${y(p.media).toFixed(1)}`).join(" ");
    const area = `${path} L${x(pts.length-1)},${H-padB} L${x(0)},${H-padB} Z`;
    const iniJanela = pts.findIndex(p => p.semana > diasAtras(J * 7));
    const janelaX = iniJanela < 0 ? null : pts.length > 1 ? x(iniJanela) : padL;
    const grid = Array.from({ length: N }, (_, k) => {
      const yy = y(6 - (k * 5) / (N - 1));
      return `<line x1="${padL}" x2="${W-padR}" y1="${yy}" y2="${yy}" stroke="#ECEBE5" />
              <text x="${padL-10}" y="${yy+4}" text-anchor="end" font-size="11" fill="#9A9A94">P${k+1}</text>`;
    }).join("");
    const last = pts[pts.length-1];
    const lx = x(pts.length-1), ly = y(last.media);
    const melhor = Math.max(...todas.map(p => p.media));

    document.getElementById("trend").innerHTML = `
      ${head}
      <div class="chart-wrap chart">
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Nota por semana">
          <defs>
            <linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#17A34A" stop-opacity=".18"/><stop offset="1" stop-color="#17A34A" stop-opacity="0"/>
            </linearGradient>
          </defs>
          ${janelaX === null ? "" : `<rect x="${janelaX}" y="${padT-10}" width="${W-padR-janelaX}" height="${H-padB-padT+10}" rx="12" fill="#F4F9F0"/>
          <text x="${(janelaX + W - padR)/2}" y="${padT-14}" text-anchor="middle" font-size="11" fill="#5E8F48">conta pro pote</text>`}
          ${grid}
          <path d="${area}" fill="url(#g)"/>
          <path d="${path}" fill="none" stroke="#0C0C0C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
          ${pts.map((p,i) => `<circle cx="${x(i)}" cy="${y(p.media)}" r="${i===pts.length-1?6:3.5}" fill="${i===pts.length-1?"#C9F36B":"#fff"}" stroke="#0C0C0C" stroke-width="${i===pts.length-1?2:1.5}"><title>${dataCurta(p.semana)} · média ${fmt(p.media)}</title></circle>`).join("")}
          ${pts.map((p,i) => (i % 2 === pts.length % 2 || i === pts.length-1) ? `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#9A9A94">${dataCurta(p.semana)}</text>` : "").join("")}
        </svg>
        <span class="tag" style="left:${(lx/W*100).toFixed(2)}%;top:${(ly/H*100).toFixed(2)}%">${fmt(last.media)} esta semana</span>
      </div>
      <div class="chart-foot">
        <div><b>${atual ? fmt(atual.nota) : "–"}</b>Média atual</div>
        <div><b>${fmt(melhor)}</b>Melhor semana</div>
        <div><b>${todas.length}</b>Semanas votadas</div>
      </div>`;
  })();

  renderRanking(5, rankingDe);
}

function renderRanking(limite, fonte, titulo){
  const lista = fonte(state.periodo)
    .filter(p => p[state.stat] > 0)
    .sort((a,b) => b[state.stat] - a[state.stat] || a.nome.localeCompare(b.nome, "pt-BR"));
  const max = lista.length ? lista[0][state.stat] : 1;
  const per = { semana: "Semana", mes: "Mês", geral: "Geral" };
  document.getElementById("ranking").innerHTML = `
    <div class="card-head" style="flex-wrap:wrap">
      <div><div class="eyebrow">${titulo ? esc(titulo) : "Rankings"}</div><div class="h2">Artilheiros e garçons</div></div>
      <div class="seg" role="tablist">
        ${Object.entries(per).map(([k,v]) => `<button class="${state.periodo===k?"on":""}" data-p="${k}">${v}</button>`).join("")}
      </div>
    </div>
    <div class="tabs">
      <button class="${state.stat==="gols"?"on":""}" data-s="gols">⚽ Gols</button>
      <button class="${state.stat==="assistencias"?"on":""}" data-s="assistencias">🎯 Assistências</button>
    </div>
    ${lista.length ? `<ol class="rank">
      ${lista.slice(0, limite).map((p,i) => `
        <li class="${i<3?"top":""} ${p.me?"me":""}">
          <span class="pos">${i+1}</span>
          ${avatar(p.nome, p.foto)}
          <div class="who"><b>${esc(p.nome)}${p.me?" · você":""}</b><span>${esc(p.tipo)}</span>
            <div class="bar-mini"><i style="width:${(p[state.stat]/max*100).toFixed(0)}%"></i></div></div>
          <span class="val">${p[state.stat]}</span>
        </li>`).join("")}
    </ol>` : `<div class="empty">Nenhum registro nesse período.</div>`}`;
  document.querySelectorAll("#ranking [data-p]").forEach(b => b.onclick = () => { state.periodo = b.dataset.p; renderRanking(limite, fonte, titulo); });
  document.querySelectorAll("#ranking [data-s]").forEach(b => b.onclick = () => { state.stat = b.dataset.s; renderRanking(limite, fonte, titulo); });
}

/* ===================== JOGADORES (votação) ===================== */
function renderJogadores(){
  const id = app.user.id;
  const votam = ["votacao", "misto"].includes(app.pelada.metodo);
  const minhas = new Set(app.presencas.filter(p => p.jogador_id === id).map(p => p.partida_id));
  const partida = [...app.partidas].reverse().find(p => minhas.has(p.id));
  const tabela = potes();
  let votacao;
  if (!votam) {
    votacao = `<div class="empty">Nessa pelada o pote é definido ${app.pelada.metodo === "organizador" ? "pelo organizador" : "pelo desempenho"},<br>então não tem votação.</div>`;
  } else if (!partida) {
    votacao = `<div class="empty">Quando o presidente marcar que você jogou uma partida,<br>a votação dela aparece aqui.</div>`;
  } else {
    const colegas = app.presencas.filter(p => p.partida_id === partida.id && p.jogador_id !== id).map(p => p.jogador_id);
    const notaDe = vid => (app.meusVotos.find(v => v.partida_id === partida.id && v.votado_id === vid) || {}).nota;
    const faltam = colegas.filter(vid => !notaDe(vid)).length;
    votacao = `
      <p class="note">${dataLonga(partida.data)} · ${faltam ? `falta${faltam>1?"m":""} ${plural(faltam, "voto", "votos")}` : "todos votados ✓"}<br>
      Dê de 1 a 6: <b>6 = jogou muito</b>. Seu voto é secreto.</p>
      ${colegas.length ? `<ul class="list" style="margin-top:8px">
        ${colegas.map(vid => `
          <li>
            ${avatarDe(vid)}
            <div class="who"><b>${esc(nomeDe(vid))}</b><span>${notaDe(vid) ? "Votado" : "Falta votar"}</span></div>
            <div class="notas">${[1,2,3,4,5,6].map(n => `<button class="${notaDe(vid)===n?"on":""}" data-act="votar" data-partida="${partida.id}" data-jogador="${vid}" data-nota="${n}" aria-label="Nota ${n}">${n}</button>`).join("")}</div>
          </li>`).join("")}
      </ul>` : `<div class="empty">Ninguém mais foi marcado nessa partida.</div>`}`;
  }
  const geral = rankingDe("geral");
  view.innerHTML = `
    <section class="card fade">
      <div class="card-head"><div><div class="eyebrow">Votação</div><div class="h2">Como a galera jogou?</div></div></div>
      ${votacao}
    </section>
    <section class="card fade" style="animation-delay:.05s">
      <div class="card-head"><div><div class="eyebrow">Elenco</div><div class="h2">${plural(app.membros.length, "jogador", "jogadores")}</div></div></div>
      <ul class="list">
        ${[...app.membros].sort((a,b) => nomeDe(a.jogador_id).localeCompare(nomeDe(b.jogador_id), "pt-BR")).map(m => {
          const r = geral.find(g => g.id === m.jogador_id);
          const t = tabela.get(m.jogador_id);
          return `<li>
            ${avatarDe(m.jogador_id)}
            <div class="who"><b>${esc(nomeDe(m.jogador_id))}${m.jogador_id===id?" · você":""}</b><span>${rotuloMembro(m)} · ⚽ ${r.gols} · 🎯 ${r.assistencias}</span></div>
            <span class="pill soft">${t ? `Pote ${t.pote}` : "–"}</span>
          </li>`;
        }).join("")}
      </ul>
    </section>`;
}

function heroPelada(){
  const p = app.pelada, mes = mesAtual();
  const mens = app.membros.filter(m => m.tipo === "mensalista").length;
  const novos = app.membros.filter(m => (m.entrou_em || "").startsWith(mes)).length;
  const vagas = app.partidas.length * app.membros.length;
  const presenca = vagas ? Math.round((app.presencas.length / vagas) * 100) + "%" : "–";
  const topo = app.modoDev ? `<a href="#peladas">← Peladas</a> · Código ${esc(p.codigo_convite)}`
    : souPresidente() ? `✓ Presidente · Código ${esc(p.codigo_convite)}`
    : `✓ ${cap(app.membro.tipo)}`;
  return `
    <section class="hero fade" style="min-height:0">
      <span class="check">${topo}</span>
      <h1 class="sm">${esc(p.nome)}</h1>
      <p class="sub">${esc(quando(p) || "Sua pelada")}</p>
      <div class="pote-label">Jogadores</div>
      <div class="pote-row" style="margin:0 0 22px">

}

/* ===================== AÇÕES ===================== */
async function recarregar(){ await carregar(); route(); }
async function salvarPelada(campos){
  ok(await sb.from("peladas").update(campos).eq("id", app.pelada.id));
  Object.assign(app.pelada, campos);
  const t = app.todas.find(p => p.id === app.pelada.id);
  if (t) Object.assign(t, campos);
  aviso("Salvo");
}
const linkConvite = () => `${location.origin}${location.pathname}#convite=${app.pelada.codigo_convite}`;

const ACOES = {
  login: el => { state.login = el.dataset.modo; if (el.dataset.modo === "senha") state.loginPelada = ""; renderLogin(); },
  abrir: el => run(() => abrirPelada(el.dataset.id)),
  abrirDev: el => run(async () => { location.hash = "pelada"; await abrirPelada(el.dataset.id); }),
  trocar: () => run(async () => { app.pelada = null; gravar("pelada", null); await carregarPeladas(); route(); }),
  painel: () => run(async () => { app.modoDev = true; app.pelada = null; await carregarTodas(); location.hash = "peladas"; route(); }),
  sair: () => run(async () => { ok(await sb.auth.signOut()); }),
  copiar: () => run(async () => { await navigator.clipboard.writeText(linkConvite()); aviso("Link de convite copiado!"); }),
  novoCodigo: () => run(async () => {
    const c = ok(await sb.rpc("novo_codigo", { p: app.pelada.id }));
    app.pelada.codigo_convite = c;
    const t = app.todas.find(p => p.id === app.pelada.id);
    if (t) t.codigo_convite = c;
    aviso(`Novo código: ${c}. O antigo parou de funcionar.`);
    route();
  }),
  copiarPres: () => run(async () => {
    await navigator.clipboard.writeText(`${app.pelada.codigo_convite}-${app.pelada.sufixo}`);
    aviso("Código do presidente copiado!");
  }),
  novoCodigoPres: () => run(async () => {
    app.pelada.sufixo = ok(await sb.rpc("novo_codigo_presidente", { p: app.pelada.id }));
    aviso(`Novo código do presidente: ${app.pelada.codigo_convite}-${app.pelada.sufixo}`);
    route();
  }),
  votar: el => run(async () => {
    const voto = { pelada_id: app.pelada.id, partida_id: el.dataset.partida, votante_id: app.user.id, votado_id: el.dataset.jogador, nota: Number(el.dataset.nota) };
    ok(await sb.from("votos").upsert(voto, { onConflict: "partida_id,votante_id,votado_id" }));
    app.meusVotos = app.meusVotos.filter(v => !(v.partida_id === voto.partida_id && v.votado_id === voto.votado_id)).concat(voto);
    renderJogadores();
  }),
  apagarGol: el => run(async () => { ok(await sb.from("gols").delete().eq("id", el.dataset.id)); await recarregar(); }),
  apagarLance: el => run(async () => {
    const q = Number(el.dataset.qtd);
    ok(q > 1 ? await sb.from("lances").update({ qtd: q - 1 }).eq("id", el.dataset.id) : await sb.from("lances").delete().eq("id", el.dataset.id));
    await recarregar();
  }),
  metodo: el => run(async () => { if (app.pelada.metodo !== el.dataset.valor) { await salvarPelada({ metodo: el.dataset.valor }); route(); } }),
  janela: el => run(async () => { await salvarPelada({ janela_semanas: Number(el.dataset.valor) }); route(); }),
  qtdPotes: el => run(async () => {
    const n = Math.min(Math.max(app.pelada.qtd_potes + Number(el.dataset.delta), 2), 10);
    if (n !== app.pelada.qtd_potes) { await salvarPelada({ qtd_potes: n }); route(); }
  }),
  ligarMetrica: el => run(async () => {
    const metricas = app.pelada.metricas.map((m, i) => i === Number(el.dataset.i) ? { ...m, ativo: !m.ativo } : m);
    state.editMetrica = null;
    await salvarPelada({ metricas }); route();
  }),
  editMetrica: el => { const i = Number(el.dataset.i); state.editMetrica = state.editMetrica === i ? null : i; route(); },
  addMetrica: () => { state.editMetrica = "nova"; route(); },
  fecharMetrica: () => { state.editMetrica = null; route(); },
  removerMetrica: el => run(async () => {
    const metricas = app.pelada.metricas.filter((m, i) => i !== Number(el.dataset.i));
    state.editMetrica = null;
    await salvarPelada({ metricas }); route();
  }),
  addJogador: () => { state.addJogador = !state.addJogador; renderCardJogadores(); },
  filtroJog: el => { state.filtroJog = el.dataset.valor; renderCardJogadores(); },
  verTodosJog: () => { state.verTodosJog = !state.verTodosJog; renderListaJog(); },
  editJog: el => { state.editando = state.editando === el.dataset.jogador ? null : el.dataset.jogador; renderListaJog(); },
  tipo: el => run(async () => { await mudarMembro(el.dataset.jogador, { tipo: el.dataset.valor }); }),
  papel: el => run(async () => { await mudarMembro(el.dataset.jogador, { papel: el.dataset.valor }); }),
  poteManual: el => run(async () => {
    const m = membroDe(el.dataset.jogador), N = app.pelada.qtd_potes;
    const atual = m.pote_manual || Math.ceil(N / 2);
    await mudarMembro(m.jogador_id, { pote_manual: Math.min(Math.max(atual + Number(el.dataset.delta), 1), N) });
  }),
  removerJog: el => run(async () => {
    ok(await sb.from("membros").delete().eq("pelada_id", app.pelada.id).eq("jogador_id", el.dataset.jogador));
    state.editando = null;
    aviso("Jogador removido da pelada");
    await recarregar();
  }),
  novaPelada: () => { state.novaPelada = !state.novaPelada; renderPeladasDev(); },
  filtro: el => { state.filtro = el.dataset.valor; renderPeladasDev(); },
  verTodas: () => { state.verTodas = !state.verTodas; renderListaPeladas(); }
};

async function mudarMembro(jogador, campos){
  ok(await sb.from("membros").update(campos).eq("pelada_id", app.pelada.id).eq("jogador_id", jogador));
  Object.assign(membroDe(jogador), campos);
  if (jogador === app.user.id && campos.papel && !app.modoDev) return recarregar();
  renderListaJog();
}

const MUDANCAS = {
  selPartida: el => { state.partida = el.value; route(); },
  presenca: el => run(async () => {
    const linha = { pelada_id: app.pelada.id, partida_id: state.partida, jogador_id: el.dataset.jogador };
    if (el.checked) ok(await sb.from("presencas").insert(linha));
    else ok(await sb.from("presencas").delete().eq("partida_id", linha.partida_id).eq("jogador_id", linha.jogador_id));
    await recarregar();
  }),
  peso: el => run(async () => { await salvarPelada({ peso_votacao: Number(el.value) }); })
};

const INPUTS = {
  busca: el => { state.busca = el.value; renderListaPeladas(); },
  buscaJog: el => { state.buscaJog = el.value; renderListaJog(); },
  buscaUsu: el => { state.buscaUsu = el.value; renderListaUsu(); },
  pesoAoVivo: el => { document.getElementById("pesoLegenda").innerHTML = `<b>Votação ${el.value}%</b><span>Desempenho ${100 - el.value}%</span>`; }
};

async function comBotao(f, fn){
  const msg = document.getElementById("loginMsg");
  const b = f.querySelector("button:not([type=button])");
  b.disabled = true;
  if (msg) { msg.className = "msg"; msg.textContent = ""; }
  try { await fn(msg); }
  catch (e) { console.error(e); if (msg) { msg.className = "msg err"; msg.textContent = traduz(e); } else aviso(traduz(e)); }
  b.disabled = false;
}

const FORMS = {
  codigo: (f, d) => comBotao(f, async msg => {
    const codigo = d.get("codigo").trim().toUpperCase();
    state.loginEmail = d.get("email").trim();
    const nome = ok(await sb.rpc("pelada_por_codigo", { codigo, email: state.loginEmail }));
    if (!nome) throw new Error("Código de convite inválido");
    gravar("convite", codigo);
    state.loginPelada = nome;
    state.login = "cadastro";
    renderLogin();
  }),
  cadastro: (f, d) => comBotao(f, async msg => {
    const r = await sb.auth.signUp({ email: state.loginEmail, password: d.get("senha"), options: {
      data: { nome: d.get("nome").trim(), apelido: d.get("apelido").trim() },
      emailRedirectTo: location.origin + location.pathname
    } });
    if (r.error && r.error.message === "User already registered") {
      state.login = "senha";
      renderLogin();
      document.getElementById("loginMsg").textContent = "Esse e-mail já tem conta. Digite sua senha.";
      return;
    }
    const dados = ok(r);
    if (!dados.session) msg.textContent = "Conta criada! Abra o link que mandamos pro seu e-mail e depois entre com sua senha.";
  }),
  senha: (f, d) => comBotao(f, async () => {
    state.loginEmail = d.get("email").trim();
    ok(await sb.auth.signInWithPassword({ email: state.loginEmail, password: d.get("senha") }));
  }),
  entrarCodigo: (f, d) => run(async () => {
    const id = ok(await sb.rpc("entrar_na_pelada", { codigo: d.get("codigo").trim().toUpperCase() }));
    if (!id) return ACOES.painel();   // código do dev
    await carregarPeladas();
    location.hash = "inicio";
    await abrirPelada(id);
  }),
  criarPelada: (f, d) => run(async () => {
    const nova = ok(await sb.from("peladas").insert({
      nome: d.get("nome").trim(), dia_semana: d.get("dia").trim() || null,
      horario: d.get("horario").trim() || null, local: d.get("local").trim() || null
    }).select("*").single());
    const presidente = d.get("presidente").trim();
    if (presidente) {
      const r = await sb.rpc("adicionar_por_email", { p: nova.id, email_: presidente, tipo_: "mensalista", papel_: "presidente" });
      if (r.error) aviso(`Pelada criada, mas o presidente não foi adicionado: ${traduz(r.error)}`);
    }
    state.novaPelada = false;
    await carregarTodas();
    location.hash = "pelada";
    await abrirPelada(nova.id);
  }),
  dados: (f, d) => run(async () => {
    const campos = { nome: d.get("nome").trim(), dia_semana: d.get("dia").trim() || null,
      horario: d.get("horario").trim() || null, local: d.get("local").trim() || null };
    if (app.modoDev) campos.status = d.get("status");
    await salvarPelada(campos);
    route();
  }),
  metrica: (f, d) => run(async () => {
    const i = f.dataset.i, peso = Number(d.get("peso"));
    let metricas;
    if (i === "nova") {
      const nome = d.get("nome").trim();
      const base = nome.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "") || "metrica";
      let chave = base, n = 2;
      while (app.pelada.metricas.some(m => m.chave === chave)) chave = `${base}_${n++}`;
      metricas = [...app.pelada.metricas, { chave, nome, peso, ativo: true, tipo: "manual" }];
    } else {
      metricas = app.pelada.metricas.map((m, k) => k === Number(i)
        ? { ...m, peso, ...(m.tipo === "manual" ? { nome: d.get("nome").trim() } : {}) } : m);
    }
    state.editMetrica = null;
    await salvarPelada({ metricas });
    route();
  }),
  addJogador: (f, d) => run(async () => {
    const r = ok(await sb.rpc("adicionar_jogador", { p: app.pelada.id, nome_: d.get("nome").trim(), email_: d.get("email").trim() || null, tipo_: d.get("tipo"), papel_: d.get("papel") }));
    state.addJogador = false;
    aviso(r === "conta" ? "Jogador adicionado!" : "Perfil criado, aguardando cadastro");
    await recarregar();
  }),
  emailPendente: (f, d) => run(async () => {
    const r = ok(await sb.rpc("definir_email", { jogador: f.dataset.jogador, email_: d.get("email").trim() }));
    if (r === "vinculado") { state.editando = null; aviso("Essa pessoa já tinha conta: perfil ligado!"); }
    else aviso("E-mail salvo. Liga assim que a pessoa criar a conta.");
    await recarregar();
  }),
  novaPartida: (f, d) => run(async () => {
    const nova = ok(await sb.from("partidas").insert({ pelada_id: app.pelada.id, data: d.get("data") }).select("id").single());
    await carregar();
    state.partida = nova.id;
    route();
  }),
  novoGol: (f, d) => run(async () => {
    ok(await sb.from("gols").insert({
      pelada_id: app.pelada.id, partida_id: state.partida,
      autor_id: d.get("autor"), assistencia_id: d.get("assist") || null
    }));
    await recarregar();
  }),
  novoLance: (f, d) => run(async () => {
    const jogador = d.get("jogador"), metrica = d.get("metrica");
    const existe = app.lances.find(l => l.partida_id === state.partida && l.jogador_id === jogador && l.metrica === metrica);
    ok(existe ? await sb.from("lances").update({ qtd: existe.qtd + 1 }).eq("id", existe.id)
      : await sb.from("lances").insert({ pelada_id: app.pelada.id, partida_id: state.partida, jogador_id: jogador, metrica }));
    await recarregar();
  }),
  patrocinio: (f, d) => run(async () => {
    const patrocinio = { nome: d.get("nome").trim(), texto: d.get("texto").trim(), url: d.get("url").trim(), logo: d.get("logo").trim() };
    ok(await sb.from("config").update({ patrocinio }).eq("id", 1));
    app.patrocinio = patrocinio;
    aviso("Patrocinador salvo");
  })
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el && ACOES[el.dataset.act]) { e.preventDefault(); ACOES[el.dataset.act](el); }
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-change]");
  if (el && MUDANCAS[el.dataset.change]) MUDANCAS[el.dataset.change](el);
});
document.addEventListener("input", e => {
  const el = e.target.closest("[data-input]");
  if (el && INPUTS[el.dataset.input]) INPUTS[el.dataset.input](el);
});
document.addEventListener("submit", e => {
  const f = e.target;
  if (FORMS[f.dataset.form]) { e.preventDefault(); FORMS[f.dataset.form](f, new FormData(f)); }
});

/* ===================== INÍCIO DA SESSÃO ===================== */
if (location.hash.startsWith("#convite=")) {
  gravar("convite", decodeURIComponent(location.hash.slice(9)).trim().toUpperCase());
  history.replaceState(null, "", location.pathname + location.search);
}
sb.auth.onAuthStateChange((evento, session) => {
  // fora do callback: o supabase-js não deixa chamar o banco direto aqui dentro
  setTimeout(() => {
    if (session && (!app.user || app.user.id !== session.user.id)) entrar(session.user);
    else if (!session && (app.user || evento === "INITIAL_SESSION")) {
      Object.assign(app, vazio());
      state.login = ler("convite") ? "codigo" : state.login;
      route();
    }
  }, 0);
});
</script>
